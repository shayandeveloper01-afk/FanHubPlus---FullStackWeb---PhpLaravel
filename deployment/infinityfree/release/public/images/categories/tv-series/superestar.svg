<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Superestar — Official Series Trailer</title>
  <desc id="desc">A dramatic spotlight on a concert stage for the Superestar series.</desc>
  <defs>
